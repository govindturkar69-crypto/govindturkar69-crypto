name: Update Profile Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=govindturkar69-crypto&theme=dark&hide_border=true&background=0D1117&ring=D4AF37&fire=D4AF37&currStreakNum=FFFFFF&sideNums=FFFFFF
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: govindturkar69-crypto
          output_path: profile/trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg profile/trophy.svg
          git commit -m "Update profile stats" || exit 0
          git push
