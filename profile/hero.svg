<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b11"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="18" y="18" width="1164" height="324" rx="22" fill="none" stroke="url(#gold)" stroke-width="2" opacity=".75">
    <animate attributeName="opacity" values=".35;.95;.35" dur="4s" repeatCount="indefinite"/>
  </rect>

  <circle cx="80" cy="70" r="8" fill="#ff5f57"/>
  <circle cx="108" cy="70" r="8" fill="#febc2e"/>
  <circle cx="136" cy="70" r="8" fill="#28c840"/>

  <text x="70" y="135" fill="#8b949e" font-size="20" font-family="monospace">$ whoami</text>
  <text x="70" y="190" fill="#ffffff" font-size="48" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Govind Turkar</text>
  <text x="70" y="232" fill="#58a6ff" font-size="24" font-weight="600" font-family="Segoe UI,Arial,sans-serif">
    Full-Stack Software Developer • Backend Engineering • AI-Integrated Products
  </text>
  <text x="70" y="278" fill="#c9d1d9" font-size="19" font-family="monospace">
    React • Next.js • Node.js • FastAPI • PostgreSQL • WebSockets • RAG • Docker
  </text>

  <g transform="translate(900 165)" filter="url(#glow)">
    <circle r="82" fill="none" stroke="#30363d" stroke-width="1.5"/>
    <circle r="62" fill="none" stroke="#21262d" stroke-width="1"/>
    <path d="M0,-82 A82,82 0 0 1 71,41" fill="none" stroke="#58a6ff" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-62 A62,62 0 0 0 -54,31" fill="none" stroke="#d4af37" stroke-width="5" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </path>
    <text x="-34" y="8" fill="#ffffff" font-size="22" font-family="monospace">&lt;/&gt;</text>
  </g>

  <text x="70" y="320" fill="#8b949e" font-size="15" font-family="monospace">
    idea → architecture → code → test → deploy → improve
  </text>
</svg>