  </g>

  <g transform="translate(890 125)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#3fb950"/>
    <text x="20" y="32" fill="#3fb950" font-size="13">DEVTOOLS / CI</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">SelfHealCI</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">Automation • Recovery</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">CI/CD • Reliability</text>
    <circle cx="225" cy="145" r="6" fill="#3fb950">
      <animate attributeName="r" values="4;9;4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(190 345)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#f97316"/>
    <text x="20" y="32" fill="#f97316" font-size="13">APPLIED ML</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">RealtyIQ</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">Prediction • Explainability</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">XGBoost • SHAP</text>
    <circle cx="225" cy="145" r="6" fill="#f97316">
      <animate attributeName="r" values="4;9;4" dur="3.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(470 345)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#ec4899"/>
    <text x="20" y="32" fill="#ec4899" font-size="13">DEEP LEARNING</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">Stock LSTM</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">Time Series • Walk-Forward</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">PyTorch • Streamlit</text>
    <circle cx="225" cy="145" r="6" fill="#ec4899">
      <animate attributeName="r" values="4;9;4" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(750 345)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#06b6d4"/>
    <text x="20" y="32" fill="#06b6d4" font-size="13">FRONTEND / REALTIME</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">Aurora Weather</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">Realtime UI • AQI • Cache</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">React • TS • Redis</text>
    <circle cx="225" cy="145" r="6" fill="#06b6d4">
      <animate attributeName="r" values="4;9;4" dur="3.3s" repeatCount="indefinite"/>
    </circle>
