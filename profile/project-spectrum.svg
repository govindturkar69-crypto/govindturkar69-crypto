<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<defs>
  <linearGradient id="bgp" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#080c12"/>
    <stop offset="100%" stop-color="#111827"/>
  </linearGradient>
</defs>
<rect width="1200" height="620" rx="28" fill="url(#bgp)"/>
<text x="50" y="62" fill="#fff" font-size="30" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Best Project by Field</text>
<text x="50" y="92" fill="#8b949e" font-size="16" font-family="Segoe UI,Arial,sans-serif">A quick visual summary of the strongest project in each area</text>

<g font-family="Segoe UI,Arial,sans-serif">
  <g transform="translate(50 125)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#58a6ff"/>
    <text x="20" y="32" fill="#58a6ff" font-size="13">FULL-STACK</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">NexusCode</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">Realtime • AI • DevTools</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">React • FastAPI • PostgreSQL</text>
    <circle cx="225" cy="145" r="6" fill="#58a6ff">
      <animate attributeName="r" values="4;9;4" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(330 125)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#d4af37"/>
    <text x="20" y="32" fill="#d4af37" font-size="13">BACKEND / SYSTEMS</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">Redis in Java</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">Networking • Storage • Caching</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">Java • TCP • Key-Value</text>
    <circle cx="225" cy="145" r="6" fill="#d4af37">
      <animate attributeName="r" values="4;9;4" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(610 125)">
    <rect width="260" height="180" rx="18" fill="#0d1117" stroke="#8b5cf6"/>
    <text x="20" y="32" fill="#8b5cf6" font-size="13">AI / RAG</text>
    <text x="20" y="72" fill="#fff" font-size="26" font-weight="700">VeriDoc</text>
    <text x="20" y="105" fill="#8b949e" font-size="14">RAG • LLM • Citations</text>
    <text x="20" y="137" fill="#c9d1d9" font-size="14">Python • Retrieval • Grounding</text>
    <circle cx="225" cy="145" r="6" fill="#8b5cf6">
      <animate attributeName="r" values="4;9;4" dur="3.2s" repeatCount="indefinite"/>
